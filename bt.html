    b.innerHTML="<b>"+L[k-1]+"</b><span>"+q[k]+"</span>";
    b.onclick=function(){if(h.dataset.l)return;h.dataset.l=1;sc[k-1]++;b.classList.add("pick");h.classList.add("done");var bm=$("beam");bm.classList.remove("go");bm.offsetWidth;bm.classList.add("go");setTimeout(function(){i++;i<Q.length?ask():done()},420)};
    h.appendChild(b)})(k)}
}
function done(){
  var m=0,r=0;sc.forEach(function(v,k){if(v>m){m=v;r=k}});
  var o=OS[r],h="<div class='big'>"+o.e+"</div><span class='tag'>"+o.tag+"</span><h1>Bộ não bạn chạy <span>"+o.n+"</span></h1><p>"+o.d+"</p><p><b>Điểm mạnh:</b> "+o.s.join(", ")+"</p>";
  OS.forEach(function(x,k){var pc=Math.round(sc[k]/Q.length*100);h+="<div class='row'><span class='n'>"+x.n+"</span><span class='t'><i style='width:"+pc+"%'></i></span><span class='pc'>"+pc+"%</span></div>"});
  h+="<p style='margin-top:20px'>Đáp án nhiều nhất: "+L[r]+" ("+m+"/"+Q.length+" câu)</p><button class='btn' id='again'>Làm lại</button><button class='ghost' id='quit'>Thoát</button>";
  $("result").innerHTML=h;$("again").onclick=start;$("quit").onclick=function(){show("intro")};show("result")
}
function start(){sc=[0,0,0,0,0];i=0;show("quiz");ask()}
$("start").onclick=start;
$("exit").onclick=function(){show("intro")};
</script>
</body>
